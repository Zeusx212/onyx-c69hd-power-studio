name: Build and Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "Onyx_C69HD_Power_Studio" `
            --collect-all "customtkinter" `
            --collect-all "PIL" `
            --add-data "assets;assets" `
            --add-data "scripts;scripts" `
            run_gui.py

      - name: Create Windows ZIP Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\Onyx_C69HD_Power_Studio\backups"
          if (Test-Path "assets\twrp_c69hd_recovery.img") {
            Copy-Item "assets\twrp_c69hd_recovery.img" -Destination "dist\Onyx_C69HD_Power_Studio\backups\" -Force
          }
          Compress-Archive -Path "dist\Onyx_C69HD_Power_Studio" -DestinationPath "dist\Onyx_C69HD_Power_Studio_win_x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx_C69HD_Power_Studio_win_x64
          path: dist/Onyx_C69HD_Power_Studio_win_x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Standalone Binary
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "Onyx_C69HD_Power_Studio" \
            --collect-all "customtkinter" \
            --collect-all "PIL" \
            --add-data "assets:assets" \
            --add-data "scripts:scripts" \
            run_gui.py

      - name: Create Linux Tarball Archive
        run: |
          mkdir -p dist/Onyx_C69HD_Power_Studio/backups
          if [ -f "assets/twrp_c69hd_recovery.img" ]; then
            cp assets/twrp_c69hd_recovery.img dist/Onyx_C69HD_Power_Studio/backups/
          fi
          cd dist
          tar -czvf Onyx_C69HD_Power_Studio_linux_x64.tar.gz Onyx_C69HD_Power_Studio
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx_C69HD_Power_Studio_linux_x64
          path: dist/Onyx_C69HD_Power_Studio_linux_x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "Onyx_C69HD_Power_Studio" \
            --collect-all "customtkinter" \
            --collect-all "PIL" \
            --add-data "assets:assets" \
            --add-data "scripts:scripts" \
            --osx-bundle-identifier "com.zeusx212.onyx_c69hd_power_studio" \
            run_gui.py

      - name: Create macOS ZIP Archive
        run: |
          cd dist
          zip -r Onyx_C69HD_Power_Studio_macOS.zip Onyx_C69HD_Power_Studio.app
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx_C69HD_Power_Studio_macOS
          path: dist/Onyx_C69HD_Power_Studio_macOS.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository for Release Assets
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/Onyx_C69HD_Power_Studio_win_x64/Onyx_C69HD_Power_Studio_win_x64.zip
            release_artifacts/Onyx_C69HD_Power_Studio_linux_x64/Onyx_C69HD_Power_Studio_linux_x64.tar.gz
            release_artifacts/Onyx_C69HD_Power_Studio_macOS/Onyx_C69HD_Power_Studio_macOS.zip
            assets/twrp_c69hd_recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
